services:
  - type: web
    name: foodbridge-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # ─── Set the following secrets in your Render dashboard ───────────────
      - key: MONGO_URI
        sync: false   # Must be set manually in Render Environment tab
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false   # Your Vercel frontend URL, e.g. https://foodbridge.vercel.app
      # ─── Cloudinary ───────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ─── Email / SMTP ─────────────────────────────────────────────────────
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
